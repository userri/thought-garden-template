<!doctype html>
<meta charset="utf-8" />
<title>thought-garden 설정</title>
<style>
  body { font-family: sans-serif; max-width: 420px; margin: 2rem auto; }
  label { display: block; margin-top: 1rem; font-weight: bold; }
  input { width: 100%; padding: 6px; box-sizing: border-box; }
  button { margin-top: 1.5rem; padding: 8px 20px; }
  #status { margin-left: 10px; color: green; }
</style>
<h2>thought-garden harvester</h2>
<label>GitHub 토큰 (repo contents 쓰기 권한)</label>
<input id="token" type="password" placeholder="ghp_..." />
<label>레포 소유자</label>
<input id="owner" placeholder="예: yuri-lim" />
<label>레포 이름</label>
<input id="repo" placeholder="예: thought-garden" />
<label>내 블로그 ID</label>
<input id="myBlogId" placeholder="예: jokebear67" />
<button id="save">저장</button><span id="status"></span>
<hr style="margin-top:2rem" />
<button id="backfill">비공개 글 날짜 백필</button><span id="backfillStatus"></span>
<p style="color:#666;font-size:0.85rem">잘못 저장된 작성일을 네이버 원본 날짜로 일괄 교정합니다.
글 수에 따라 수 분 걸려요. 이 페이지를 닫지 마세요.</p>
<script src="options.js"></script>
