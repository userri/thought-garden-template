name: cross report

on:
  workflow_dispatch:
    inputs:
      model:
        description: "TG_MODEL — 교차는 코퍼스가 Haiku 컨텍스트(200k)를 초과해 Sonnet 필수"
        default: "claude-sonnet-5"
    # 수동 실행 전용 — 공개 vs 비공개 교차 분석

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python analyze.py --cross
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TG_MODEL: ${{ inputs.model }}
      - name: commit & push
        run: |
          git config user.name "thought-garden-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "report(cross): $(date +%F)"
          git pull --rebase --autostash && git push
